<div id="app"><div class="empty" style="padding-top:40vh">Loading…</div></div>

<script src="app.js?v=1.4.1"></script>
<script>
if ('serviceWorker' in navigator && !/[?&]dev\b/.test(location.search)) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
    reg.update();
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update(); });
  }).catch(function(){});
  var hadController = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
}
</script>
